[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/dashboard"
  to = "/.netlify/functions/ssr"
  status = 200
  force = true

[[redirects]]
  from = "/login"
  to = "/.netlify/functions/ssr"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/.netlify/functions/ssr"
  status = 200
  force = true
